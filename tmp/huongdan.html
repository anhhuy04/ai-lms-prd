<head>
<meta charset="UTF-8"/>
<title>Sơ đồ ca sử dụng</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b}

/* ── HEADER ── */
.hdr{background:#1e293b;color:#fff;padding:28px 40px 24px}
.hdr-badge{display:inline-block;background:rgba(99,102,241,.25);border:1px solid rgba(99,102,241,.4);color:#a5b4fc;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.hdr h1{font-size:22px;font-weight:700;margin-bottom:6px}
.hdr p{color:#94a3b8;font-size:13px}
.legend-row{display:flex;gap:20px;margin-top:18px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:7px;font-size:12px}
.leg-dot{width:10px;height:10px;border-radius:50%}
.leg-dash{width:24px;height:2px;border-top:2px dashed currentColor;opacity:.7}

/* ── NAV ── */
.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 40px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav::-webkit-scrollbar{display:none}
.tab{padding:13px 16px;font-size:12.5px;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;user-select:none}
.tab:hover{color:#1e293b}
.tab.on{color:#6366f1;border-bottom-color:#6366f1;font-weight:700}

/* ── CONTENT ── */
.wrap{max-width:720px;margin:0 auto;padding:28px 24px 60px}
.sec{display:none}
.sec.on{display:block}
.sec-num{font-size:11px;font-weight:700;color:#6366f1;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.sec-title{font-size:19px;font-weight:700;margin-bottom:4px}
.sec-desc{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:16px}

/* ── DIAGRAM CARD ── */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 3px 16px rgba(0,0,0,.07);overflow:hidden}
.card-top{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:#f8fafc;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.chip-hs{background:#dcfce7;color:#166534}
.chip-gv{background:#dbeafe;color:#1e40af}
.chip-ai{background:#f3e8ff;color:#7e22ce}
.chip-ht{background:#fef3c7;color:#92400e}
.lgs{display:flex;gap:14px;align-items:center}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b}
.lg-line{width:20px;height:1.5px;background:#6366f1}
.lg-dash{width:20px;height:0;border-top:1.5px dashed #a855f7}
.svg-wrap{overflow-x:auto;padding:16px 12px}
.svg-wrap svg{display:block;margin:0 auto;max-width:100%;height:auto}

/* ── PRINT ── */
@media print{
  body{background:#fff}
  .hdr,.nav,.no-print{display:none}
  .wrap{max-width:100%;padding:0;margin:0}
  .sec{display:block;page-break-after:always}
  .sec:last-child{page-break-after:auto}
  .sec-num,.sec-title,.sec-desc{padding:0 0 4px 0}
  .card{border:none;box-shadow:none;border-radius:0}
  .card-top{display:none}
  .svg-wrap{padding:0;overflow:visible}
  .svg-wrap svg{max-width:100%}
}
</style>

<script>
// ─────────────────────────────────────────────────────────────────────────
// SVG RENDERER
// ─────────────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, txt) => {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(a||{})) e.setAttribute(k, String(v));
  if (txt !== undefined) e.textContent = txt;
  return e;
};

// Ellipse border intersection from external point (lx,ly) toward center (cx,cy)
function ellPort(lx, ly, cx, cy, rx, ry) {
  const dx = lx - cx, dy = ly - cy, d = Math.hypot(dx, dy);
  if (d < 1) return {x: cx+rx, y: cy};
  const t = 1 / Math.sqrt((dx/d/rx)**2 + (dy/d/ry)**2);
  return { x: cx + dx/d * t, y: cy + dy/d * t };
}

// Actor center for line routing (body middle)
function actPort(cx, cy) { return {x: cx, y: cy - 8}; }

function makeSVG(w, h, colorKey) {
  const svg = el('svg', {
    width: w, height: h, viewBox: `0 0 ${w} ${h}`,
    xmlns: NS, style: 'font-family:Segoe UI,sans-serif'
  });
  const defs = el('defs');

  // Arrow marker (open, for include/extend)
  const mk = el('marker', { id: `arr${colorKey}`, markerWidth:9, markerHeight:7,
                             refX:8.5, refY:3.5, orient:'auto' });
  mk.appendChild(el('polyline', {
    points:'1,1 8,3.5 1,6', fill:'none',
    stroke: colorKey, 'stroke-width':'1.4'
  }));
  defs.appendChild(mk);

  svg.appendChild(defs);
  return svg;
}

// Draw group boundary box
function drawGroup(svg, x, y, w, h, label, bc) {
  svg.appendChild(el('rect', {
    x, y, width:w, height:h, rx:9, ry:9,
    fill:`${bc}18`, stroke:bc, 'stroke-width':'1.2',
    'stroke-dasharray':'5,3'
  }));
  // label background
  const tw = label.length * 7 + 12;
  svg.appendChild(el('rect', { x: x+8, y: y-8, width:tw, height:16, rx:4, fill:'#fff' }));
  svg.appendChild(el('text', {
    x: x+14, y: y+5, 'font-size':'10.5', 'font-weight':'700',
    fill: bc, 'letter-spacing':'.2'
  }, label));
}

// Draw use case ellipse (text: array of strings)
function drawUC(svg, cx, cy, lines, bc, bgc) {
  const ry = lines.length > 1 ? 26 : 18;
  const rx = 78;
  svg.appendChild(el('ellipse', {
    cx, cy, rx, ry, fill: bgc || '#fff', stroke: bc, 'stroke-width':'1.6'
  }));
  const lh = 13, top = cy - (lines.length-1)*lh/2;
  lines.forEach((line, i) => {
    svg.appendChild(el('text', {
      x: cx, y: top + i*lh + 4,
      'text-anchor':'middle', 'font-size':'11', fill:'#1a202c'
    }, line));
  });
}

// Draw actor stick figure
function drawActor(svg, cx, cy, lines, sc) {
  const r = 8.5;
  const h0 = cy - 30; // head center
  // head
  svg.appendChild(el('circle', { cx, cy:h0, r, fill:'#fff', stroke:sc, 'stroke-width':'1.8' }));
  // body
  svg.appendChild(el('line', { x1:cx, y1:h0+r, x2:cx, y2:cy-2, stroke:sc, 'stroke-width':'1.8' }));
  // arms
  svg.appendChild(el('line', { x1:cx-14, y1:cy-16, x2:cx+14, y2:cy-16, stroke:sc, 'stroke-width':'1.8' }));
  // legs
  svg.appendChild(el('line', { x1:cx, y1:cy-2, x2:cx-12, y2:cy+16, stroke:sc, 'stroke-width':'1.8' }));
  svg.appendChild(el('line', { x1:cx, y1:cy-2, x2:cx+12, y2:cy+16, stroke:sc, 'stroke-width':'1.8' }));
  // label
  const lh = 13;
  const top = cy + 28;
  lines.forEach((line, i) => {
    svg.appendChild(el('text', {
      x: cx, y: top + i*lh,
      'text-anchor':'middle', 'font-size':'11', 'font-weight':'600', fill: sc
    }, line));
  });
}

// Draw connection line between two elements
function drawConn(svg, x1, y1, uc, type, bc, colorKey) {
  const rx = 78, ry = uc.text.length > 1 ? 26 : 18;
  const pt = ellPort(x1, y1, uc.cx, uc.cy, rx, ry);

  if (type === 'assoc') {
    svg.appendChild(el('line', {
      x1, y1, x2:pt.x, y2:pt.y,
      stroke:'#94a3b8', 'stroke-width':'1.2'
    }));
  } else {
    // dashed with arrowhead
    const mid_x = (x1 + pt.x) / 2;
    const mid_y = (y1 + pt.y) / 2;
    svg.appendChild(el('line', {
      x1, y1, x2:pt.x, y2:pt.y,
      stroke: bc, 'stroke-width':'1.3',
      'stroke-dasharray':'5,3',
      'marker-end': `url(#arr${colorKey})`
    }));
    // label with white background
    const label = type === 'include' ? '<<bao gồm>>' : '<<mở rộng>>';
    const lw = label.length * 5.8 + 8;
    svg.appendChild(el('rect', {
      x: mid_x - lw/2, y: mid_y - 10,
      width: lw, height: 13, rx: 3,
      fill: '#fff', opacity: '.9'
    }));
    svg.appendChild(el('text', {
      x: mid_x, y: mid_y,
      'text-anchor':'middle', 'font-size':'9',
      'font-style':'italic', fill: bc
    }, label));
  }
}

// Main render function
function render(data) {
  const {w, h, groups, actors, usecases, connections, color} = data;
  const colorKey = color.border.replace('#','');
  const svg = makeSVG(w, h, colorKey);

  // 1. Groups
  for (const g of groups||[]) drawGroup(svg, g.x, g.y, g.w, g.h, g.label, color.border);

  // 2. Connection lines (behind shapes)
  const ucMap = {};
  for (const uc of usecases) ucMap[uc.id] = uc;
  const acMap = {};
  for (const ac of actors) acMap[ac.id] = ac;

  for (const c of connections||[]) {
    const fromUC = ucMap[c.from];
    const fromAC = acMap[c.from];
    const toUC = ucMap[c.to];

    if (fromAC && toUC) {
      const ap = actPort(fromAC.cx, fromAC.cy);
      drawConn(svg, ap.x, ap.y, toUC, 'assoc', color.border, colorKey);
    } else if (fromUC && toUC) {
      // UC to UC (include/extend)
      const rx1 = 78, ry1 = fromUC.text.length > 1 ? 26 : 18;
      const p1 = ellPort(toUC.cx, toUC.cy, fromUC.cx, fromUC.cy, rx1, ry1);
      drawConn(svg, p1.x, p1.y, toUC, c.type, color.border, colorKey);
    }
  }

  // 3. Use cases
  for (const uc of usecases)
    drawUC(svg, uc.cx, uc.cy, uc.text, color.border, color.bg);

  // 4. Actors
  for (const ac of actors)
    drawActor(svg, ac.cx, ac.cy, ac.label.split('\n'), color.actor);

  return svg;
}

// ─────────────────────────────────────────────────────────────────────────
// BUILD PAGE
// ─────────────────────────────────────────────────────────────────────────
const ACTOR_LABELS = { hs:'Học sinh', gv:'Giáo viên', ai:'Trí tuệ nhân tạo', ht:'Hệ thống' };
const ACTOR_CHIPS  = { hs:'chip-hs', gv:'chip-gv', ai:'chip-ai', ht:'chip-ht' };

const nav  = document.getElementById('nav');
const main = document.getElementById('main');

DIAGRAMS.forEach((d, i) => {
  // Tab
  const tab = document.createElement('div');
  tab.className = 'tab' + (i===0?' on':'');
  tab.textContent = `${d.num}. ${d.title}`;
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('on', j===i));
    document.querySelectorAll('.sec').forEach((s,j) => s.classList.toggle('on', j===i));
  };
  nav.appendChild(tab);

  // Section
  const sec = document.createElement('div');
  sec.className = 'sec' + (i===0?' on':'');

  const chips = (d.actors_shown||[]).map(a =>
    `<span class="chip ${ACTOR_CHIPS[a]}">${ACTOR_LABELS[a]}</span>`
  ).join('');

  sec.innerHTML = `
    <div class="sec-num">Sơ đồ ${d.num}</div>
    <div class="sec-title">${d.title}</div>
    <div class="sec-desc">${d.desc}</div>
    <div class="card">
      <div class="card-top">
        <div class="chips">${chips}</div>
        <div class="lgs">
          <div class="lg"><div class="lg-line"></div> Kết hợp</div>
          <div class="lg"><div class="lg-dash"></div> &lt;&lt;bao gồm&gt;&gt; / &lt;&lt;mở rộng&gt;&gt;</div>
        </div>
      </div>
      <div class="svg-wrap" id="svg-${i}"></div>
    </div>
  `;
  main.appendChild(sec);

  // Render SVG
  const svg = render(d);
  document.getElementById(`svg-${i}`).appendChild(svg);
});
</script>
